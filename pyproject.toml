[project]
name = "kg-gen"
version = "0.4.0"
authors = [{ name = "Belinda Mo", email = "justanexperimentpark@gmail.com" }]
description = "Extract a knowledge graph using LLMs from any text or messages array"
readme = "README.md"
requires-python = ">=3.10, <4.0"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
license = "MIT"
dependencies = [
    "nltk",
    "pydantic>=2.0.0",
    "pre-commit>=4.3.0",
    "ty>=0.0.1a21",
    "openai>=1.108.1",
    "sentence-transformers>=5.1.0",
    "tqdm>=4.67.1",
    "datasets>=4.4.1",
    "semhash>=0.3.2",
    # Imported directly by utils/deduplicate.py to build the custom SemHash
    # encoder used for non-English text. It also arrives transitively via
    # semhash, but that is semhash's dependency to change, not a guarantee to
    # us. No upper bound on purpose: semhash co-owns this requirement
    # (model2vec>=0.3.4, uncapped) and a ceiling here could deadlock
    # resolution when semhash raises its floor.
    "model2vec>=0.8.2",
    "inflect>=7.5.0",
    "spacy>=3.7.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.7.2",
    "rank-bm25>=0.2.2",
    "networkx>=3.0",
    "python-dotenv>=1.0.0",
    "dspy-ai>=3.0.4",
    "pathlib2>=2.3.7",
    "typer>=0.17.4",
    "ruff>=0.14.2",
    "neo4j>=5.0.0",
]

[dependency-groups]
dev = [
    "datasets>=4.1.1",
    "huggingface-hub>=0.35.0",
    "pytest>=8.4.2",
    "pytest-asyncio>=0.21.0",
    "wikipedia-api>=0.8.1",
    "matplotlib>=3.10.7",
    "mlflow>=3.6.0",
    "streamlit>=1.51.0",
    "seaborn>=0.13.2",
]
mcp = ["fastmcp>=2.10.6", "mcp>=1.12.1"]

[project.scripts]
kggen = "kg_gen.cli:main"

[project.urls]
Homepage = "https://github.com/stair-lab/kg-gen"
Issues = "https://github.com/stair-lab/kg-gen/issues"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
"kg_gen.utils" = ["template.html"]
"kg_gen.prompts" = ["*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests", "mcp/tests"]
# Tests import `src.kg_gen`, so the repo root must be importable even when
# pytest is launched as a bare `pytest` rather than `python -m pytest`.
pythonpath = ["."]
